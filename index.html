<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #scoreboard {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-align: center;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 4px solid #fff;
            border-radius: 4px;
        }
        canvas {
            display: block;
            background: #2e7d32;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            overflow-y: auto;
            padding: 20px 0;
        }
        .hidden {
            display: none !important;
        }
        select, input, button {
            padding: 6px 10px;
            font-size: 12px;
            margin: 3px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        select, input[type="text"], input[type="number"] {
            background: white;
            color: black;
            width: 240px;
        }
        button {
            background: #4CAF50;
            color: white;
            font-weight: bold;
            margin-top: 8px;
        }
        button:hover {
            background: #45a049;
        }
        label {
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
            color: #ddd;
        }
        .instructions {
            margin-top: 8px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>

        matchTime = 0;
        matchTargetMinute = Math.floor(Math.random() * 6) + 90;
        gameActive = true;
        isManuallyPaused = false;
        kickoffTeam = 'player';

        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');
        
        initTeams();
        loop();
    }

    function getRandomAiNames(count) {
        let shuffled = [...funnyAiNames].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
    }

    function initTeams() {
        scorePlayer = 0;
        scoreCpu = 0;

        let aiNames = getRandomAiNames(gameMode === '1v1' ? 1 : 2);

        if (gameMode === '1v1') {
            let cpuRandomNumber = Math.floor(Math.random() * 29) + 2;

            players = [
                { x: 280, y: 250, vx: 0, vy: 0, radius: 20, team: 'player', countryKey: playerCountry, isUser: true, isFriend: false, name: playerName, number: playerNumber, kit: playerKit },
                { x: 520, y: 250, vx: 0, vy: 0, radius: 20, team: 'cpu', countryKey: cpuCountry, isUser: false, isFriend: false, name: aiNames[0], number: cpuRandomNumber, kit: cpuKit }
            ];
        } else {
            let cpu1Num = Math.floor(Math.random() * 29) + 2;
            let cpu2Num = Math.floor(Math.random() * 29) + 2;

            players = [
                { x: 280, y: 180, vx: 0, vy: 0, radius: 19, team: 'player', countryKey: playerCountry, isUser: true, isFriend: false, name: playerName, number: playerNumber, kit: playerKit },
                { x: 280, y: 320, vx: 0, vy: 0, radius: 19, team: 'player', countryKey: playerCountry, isUser: false, isFriend: true, name: friendName, number: friendNumber, kit: playerKit },
                { x: 520, y: 180, vx: 0, vy: 0, radius: 19, team: 'cpu', countryKey: cpuCountry, isUser: false, isFriend: false, name: aiNames[0], number: cpu1Num, kit: cpuKit },
                { x: 520, y: 320, vx: 0, vy: 0, radius: 19, team: 'cpu', countryKey: cpuCountry, isUser: false, isFriend: false, name: aiNames[1], number: cpu2Num, kit: cpuKit }
            ];
        }

        resetPositions();
        updateScoreboard();
    }

    function resetPositions() {
        ball.x = field.width / 2;
        ball.y = field.height / 2;
        ball.vx = 0;
        ball.vy = 0;
        ballInPlay = false;

        if (gameMode === '1v1') {
            if (players[0]) { players[0].x = 300; players[0].y = field.height / 2; }
            if (players[1]) { players[1].x = 500; players[1].y = field.height / 2; }
        } else {
            if (players[0]) { players[0].x = 280; players[0].y = field.height / 2 - 70; }
            if (players[1]) { players[1].x = 280; players[1].y = field.height / 2 + 70; }
            if (players[2]) { players[2].x = 520; players[2].y = field.height / 2 - 70; }
            if (players[3]) { players[3].x = 520; players[3].y = field.height / 2 + 70; }
        }
    }

    function updateScoreboard() {
        let pData = countries[playerCountry];
        let cData = countries[cpuCountry];
        if (gameMode === '1v1') {
            document.getElementById('p1-score').innerText = `${playerName} (${pData.flag}): ${scorePlayer}`;
            let cpuRivalObj = players.find(p => !p.isUser && !p.isFriend);
            let cpuDisplayName = cpuRivalObj ? cpuRivalObj.name : cData.name;
            document.getElementById('cpu-score').innerText = `${cpuDisplayName} ${cData.flag}: ${scoreCpu}`;
        } else {
            document.getElementById('p1-score').innerText = `${playerName} & ${friendName} (${pData.flag}): ${scorePlayer}`;
            document.getElementById('cpu-score').innerText = `CPUs (${cData.flag}): ${scoreCpu}`;
        }
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        let currentMin = Math.floor(matchTime);
        let timerText = currentMin + "'";
        if (currentMin > 90) {
            timerText = `90'+${currentMin - 90}'`;
        }
        if (isManuallyPaused) {
            timerText += " (PAUSA)";
        } else if (!ballInPlay) {
            let sacador = kickoffTeam === 'player' ? 'SAQUE TUYO' : 'SAQUE CPU';
            timerText += ` (${sacador})`;
        }
        document.getElementById('match-timer').innerText = timerText;
    }

    function endGame() {
        gameActive = false;
        let pData = countries[playerCountry];
        let cData = countries[cpuCountry];
        let outcomeMsg = "";

        if (scorePlayer > scoreCpu) {
            outcomeMsg = gameMode === '1v1' ? `¡Victoria para ${playerName} (${pData.flag})! 🎉` : `¡Victoria de ${playerName} y ${friendName} (${pData.flag})! 🎉`;
        } else if (scorePlayer < scoreCpu) {
            let cpuRivalObj = players.find(p => !p.isUser && !p.isFriend);
            let cpuDisplayName = cpuRivalObj ? cpuRivalObj.name : cData.name;
            outcomeMsg = `Derrota ante ${cpuDisplayName} ${cData.flag}. 😢`;
        } else {
            outcomeMsg = `¡Empate muy disputado! 🤝`;
        }

        let teamLabel = gameMode === '1v1' ? playerName : `${playerName} & ${friendName}`;
        document.getElementById('gameover-result').innerHTML = `
            <b>Resultado Final:</b><br>
            ${teamLabel} (${pData.flag}) ${scorePlayer} - ${scoreCpu} CPUs (${cData.flag})<br><br>
            <i>Pitido final al minuto ${Math.floor(matchTime)}'</i><br><br>
            ${outcomeMsg}
        `;
        document.getElementById('gameover-screen').classList.remove('hidden');
    }

    function returnToMenu() {
        document.getElementById('gameover-screen').classList.add('hidden');
        document.getElementById('menu-screen').classList.remove('hidden');
    }

    function update() {
        if (!gameActive || isManuallyPaused) return;

        if (ballInPlay) {
            matchTime += 1 / 45;
            if (matchTime >= matchTargetMinute) {
                matchTime = matchTargetMinute;
                updateTimerDisplay();
                endGame();
                return;
            }
        }
        updateTimerDisplay();

        let speed = 3.9;

        // Calcular velocidad y movimiento del Jugador 1
        let p1 = players.find(p => p.isUser);
        if (p1) {
            let m1X = 0, m1Y = 0;
            if (keys['w'] || keys['W']) m1Y = -speed;
            if (keys['s'] || keys['S']) m1Y = speed;
            if (keys['a'] || keys['A']) m1X = -speed;
            if (keys['d'] || keys['D']) m1X = speed;

            p1.vx = m1X;
            p1.vy = m1Y;
            p1.x += p1.vx;
            p1.y += p1.vy;
            p1.x = Math.max(p1.radius, Math.min(field.width - p1.radius, p1.x));
            p1.y = Math.max(p1.radius, Math.min(field.height - p1.radius, p1.y));
        }

        // Jugador 2 (Amigo) si es 2v2
        if (gameMode === '2v2') {
            let p2 = players.find(p => p.isFriend);
            if (p2) {
                let m2X = 0, m2Y = 0;
                if (keys['ArrowUp']) m2Y = -speed;
                if (keys['ArrowDown']) m2Y = speed;
                if (keys['ArrowLeft']) m2X = -speed;
                if (keys['ArrowRight']) m2X = speed;

                p2.vx = m2X;
                p2.vy = m2Y;
                p2.x += p2.vx;
                p2.y += p2.vy;
                p2.x = Math.max(p2.radius, Math.min(field.width - p2.radius, p2.x));
                p2.y = Math.max(p2.radius, Math.min(field.height - p2.radius, p2.y));
            }
        }

        // --- INTELIGENCIA ARTIFICIAL CON ROLES TÁCTICOS DIFERENCIADOS ---
        let cpus = players.filter(p => !p.isUser && !p.isFriend);
        if (!ballInPlay && kickoffTeam === 'cpu') {
            cpus.forEach((cpu, index) => {
                let targetX = field.width / 2 + 50;
                let targetY = field.height / 2 + (index === 0 ? -50 : 50);
                let dx = targetX - cpu.x;
                let dy = targetY - cpu.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 2) {
                    cpu.vx = (dx / dist) * 2;
                    cpu.vy = (dy / dist) * 2;
                    cpu.x += cpu.vx;
                    cpu.y += cpu.vy;
                }
            });
        } else if (ballInPlay) {
            cpus.forEach((cpu, index) => {
                let targetX, targetY;
                let aiSpeedModifier = 0.05;

                if (gameMode === '2v2' && cpus.length === 2) {
                    if (index === 0) {
                        // CPU 1 (DELANTERO / PRESIONADOR): Va directamente a presionar y buscar la pelota
                        targetX = ball.x;
                        targetY = ball.y;
                        aiSpeedModifier = 0.055;
                    } else {
                        // CPU 2 (DEFENSOR / CIERRE TÁCTICO): Juega con criterio propio. 
                        // Mantiene una posición equilibrada cubriendo la retaguardia o basculando según el balón.
                        if (ball.x > field.width / 2) {
                            // Si la pelota está en su campo, hace cobertura defensiva inteligente
                            targetX = field.width - 200;
                            targetY = ball.y * 0.6 + (field.height / 2) * 0.4;
                        } else {
                            // Si la pelota está en campo contrario, actúa como mediocampista de contención adelantado
                            targetX = field.width - 320;
                            targetY = field.height / 2 + (ball.y < field.height / 2 ? 70 : -70);
                        }
                        aiSpeedModifier = 0.045;
                    }
                } else {
                    targetX = ball.x;
                    targetY = ball.y;
                }

                let nextX = cpu.x + (targetX - cpu.x) * aiSpeedModifier;
                let nextY = cpu.y + (targetY - cpu.y) * aiSpeedModifier;
                cpu.vx = nextX - cpu.x;
                cpu.vy = nextY - cpu.y;
                cpu.x = nextX;
                cpu.y = nextY;

                cpu.x = Math.max(cpu.radius, Math.min(field.width - cpu.radius, cpu.x));
                cpu.y = Math.max(cpu.radius, Math.min(field.height - cpu.radius, cpu.y));
            });
        }

        // --- ANTI-TUNNELING ABSOLUTO: SUB-PASOS DE FÍSICA ---
        let substeps = 8;
        let subVx = ball.vx / substeps;
        let subVy = ball.vy / substeps;

        for (let step = 0; step < substeps; step++) {
            ball.x += subVx;
            ball.y += subVy;

            // Rebotes en paredes superior e inferior
            if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy *= -1.0; subVy *= -1.0; }
            if (ball.y + ball.radius > field.height) { ball.y = field.height - ball.radius; ball.vy *= -1.0; subVy *= -1.0; }

            let inGoalY = ball.y > (field.height / 2 - goalHeight / 2) && ball.y < (field.height / 2 + goalHeight / 2);
            if (!inGoalY) {
                if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -1.0; subVx *= -1.0; }
                if (ball.x + ball.radius > field.width) { ball.x = field.width - ball.radius; ball.vx *= -1.0; subVx *= -1.0; }
            } else {
                if (ball.x < 0) {
                    scoreCpu++;
                    kickoffTeam = 'player';
                    updateScoreboard();
                    resetPositions();
                    break;
                } else if (ball.x > field.width) {
                    scorePlayer++;
                    kickoffTeam = 'cpu';
                    updateScoreboard();
                    resetPositions();
                    break;
                }
            }

            // Colisión rígida garantizada con cada jugador
            players.forEach(p => {
                let dx = ball.x - p.x;
                let dy = ball.y - p.y;
                let distance = Math.hypot(dx, dy);
                let minDist = ball.radius + p.radius;

                if (distance < minDist) {
                    if (p.isUser || p.isFriend) {
                        ballInPlay = true;
                    } else if (!p.isUser && !p.isFriend && kickoffTeam === 'cpu') {
                        ballInPlay = true;
                    }

                    let angle = Math.atan2(dy, dx);
                    if (distance === 0) angle = Math.random() * Math.PI * 2;

                    // FUERZA Y SEPARACIÓN ABSOLUTA: Desplaza la pelota por completo fuera del radio del jugador
                    ball.x = p.x + Math.cos(angle) * minDist;
                    ball.y = p.y + Math.sin(angle) * minDist;

                    let hitPower = 9.0;
                    if (p.isUser && keys[' ']) {
                        hitPower = 16.0;
                    } else if (p.isFriend && keys['Shift']) {
                        hitPower = 16.0;
                    } else if (!p.isUser && !p.isFriend) {
                        let goalTargetX = 0;
                        let goalTargetY = field.height / 2 + (Math.random() - 0.5) * 200; 
                        angle = Math.atan2(goalTargetY - ball.y, goalTargetX - ball.x) + (Math.random() - 0.5) * 0.5;
                        hitPower = 10.0;
                    }

                    // Transfiere también parte de la inercia del jugador a la pelota
                    ball.vx = Math.cos(angle) * hitPower + (p.vx || 0) * 0.6;
                    ball.vy = Math.sin(angle) * hitPower + (p.vy || 0) * 0.6;
                    
                    subVx = ball.vx / substeps;
                    subVy = ball.vy / substeps;
                }
            });
        }

        // Fricción final
        ball.vx *= ball.friction;
        ball.vy *= ball.friction;

        // Colisiones entre jugadores para evitar que se atraviesen entre ellos
        for (let i = 0; i < players.length; i++) {
            for (let j = i + 1; j < players.length; j++) {
                let pA = players[i];
                let pB = players[j];
                let dx = pB.x - pA.x;
                let dy = pB.y - pA.y;
                let dist = Math.hypot(dx, dy);
                let minDist = pA.radius + pB.radius;
                if (dist < minDist && dist > 0) {
                    let overlap = minDist - dist;
                    let angle = Math.atan2(dy, dx);
                    pA.x -= Math.cos(angle) * overlap * 0.5;
                    pA.y -= Math.sin(angle) * overlap * 0.5;
                    pB.x += Math.cos(angle) * overlap * 0.5;
                    pB.y += Math.sin(angle) * overlap * 0.5;
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, field.width, field.height);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.lineWidth = 4;
        
        ctx.beginPath();
        ctx.moveTo(field.width / 2, 0);
        ctx.lineTo(field.width / 2, field.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(field.width / 2, field.height / 2, 60, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
        ctx.fillRect(0, (field.height - goalHeight) / 2, 20, goalHeight);
        ctx.fillRect(field.width - 20, (field.height - goalHeight) / 2, 20, goalHeight);

        players.forEach(p => {
            let cData = countries[p.countryKey];
            let kitData = cData['kit' + p.kit];

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = kitData.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = (p.isUser || p.isFriend) ? '#FFEB3B' : kitData.secondary;
            ctx.stroke();
            ctx.closePath();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 11px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(p.name, p.x, p.y - 24);

            ctx.fillStyle = kitData.secondary;
            ctx.font = "bold 14px Arial";
            ctx.fillText(p.number, p.x, p.y + 2);
        });

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#000";
        ctx.stroke();
        ctx.closePath();
    }

    function loop() {
        update();
        draw();
        if (gameActive || document.getElementById('gameover-screen').classList.contains('hidden') === false) {
            requestAnimationFrame(loop);
        }
    }
</script>
